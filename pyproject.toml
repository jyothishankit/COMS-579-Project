[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legalrag"
version = "1.0.0"
description = "Advanced retrieval-augmented generation for legal documents, evaluated on LegalBench-RAG"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.60",
    "pinecone>=5.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "typer>=0.15",
    "rich>=13",
    "tiktoken>=0.8",
    "numpy>=1.26,<2.2",
    "scipy>=1.12",
    "pypdf>=5",
    "pymupdf>=1.24",
    "flashrank>=0.2.9",
    "langchain-text-splitters>=0.3",
    "tenacity>=9",
    "httpx>=0.27",
    "tqdm>=4.66",
    "orjson>=3.10",
    "pandas>=2.2",
]

[project.optional-dependencies]
ui = ["funix>=0.5.7"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
legalrag = "legalrag.cli:app"

[tool.setuptools.packages.find]
include = ["legalrag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
